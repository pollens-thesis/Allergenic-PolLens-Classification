# Render Blueprint for the PolLens API — see ../docs/deployment.md in the
# root repo for the full runbook. Values marked `sync: false` are secrets you
# paste into the Render dashboard when creating the Blueprint.
services:
  - type: web
    name: pollens-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    # Provider-aware launcher: DETECTION_BACKEND=remote (the default) calls the
    # hosted inference service (INFERENCE_URL below); yolo26 loads the models
    # in-process after its private bundle is configured (not used on this plan).
    startCommand: ./start_yolo26.sh
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Neon Postgres — the connection string from the Neon dashboard's
      # Connect panel, e.g. postgresql://user:password@ep-....neon.tech/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The Vercel frontend's URL, e.g. https://your-project.vercel.app — copy it from Vercel, do not guess (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # Microsoft Entra app registration (Application/client ID); blank = Microsoft sign-in off.
      - key: MICROSOFT_CLIENT_ID
        sync: false
      # Who may sign in. A domain also admits its subdomains; both empty admits nobody.
      - key: SIGNIN_ALLOWED_DOMAINS
        value: up.edu.ph,mseuf.edu.ph
      - key: SIGNIN_ALLOWED_EMAILS
        sync: false
      # Cloudflare R2 (S3-compatible) for slide images.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Hosted inference service (services/inference on Modal, see
      # docs/inference-modal.md): its base URL (no /detect) and the bearer token
      # stored in the Modal secret pollens-inference.
      - key: DETECTION_BACKEND
        value: remote
      - key: INFERENCE_URL
        sync: false
      - key: INFERENCE_TOKEN
        sync: false
      # "true" serves canned sample detections instead of calling the model
      # (demo/offline only); reports saved while it is on keep a Sample flag.
      - key: DETECTION_MOCK
        value: "false"
